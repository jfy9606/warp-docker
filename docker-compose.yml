version: "3"

# Before first use, build the image from this repository:
#
#   docker build --build-arg GOST_VERSION=3.2.6 -t warp-docker:latest .
#
# The upstream image caomingjun/warp does not contain the modifications
# made in this repository (MASQUE by default, GOST v3, Debian base).

services:
  warp:
    # build your own image from this repository instead of pulling the upstream
    # image, which does not contain the modifications made in this repository
    # (MASQUE by default, GOST v3, Debian-based slim image, etc.):
    #
    #   docker build --build-arg GOST_VERSION=3.2.6 -t warp-docker:latest .
    image: warp-docker:latest
    container_name: warp
    restart: always
    # add removed rule back (https://github.com/opencontainers/runc/pull/3468)
    device_cgroup_rules:
      - 'c 10:200 rwm'
    ports:
      - "1080:1080"
    environment:
      - WARP_SLEEP=2
      # - WARP_LICENSE_KEY= # optional
      # - WARP_ENABLE_NAT=1 # enable nat
    cap_add:
      # Docker already have them, these are for podman users
      - MKNOD
      - AUDIT_WRITE
      # additional required cap for warp, both for podman and docker
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
      # uncomment for nat
      # - net.ipv4.ip_forward=1
      # - net.ipv6.conf.all.forwarding=1
      # - net.ipv6.conf.all.accept_ra=2
    volumes:
      - ./data:/var/lib/cloudflare-warp
