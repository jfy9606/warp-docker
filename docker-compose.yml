# The upstream image caomingjun/warp does not contain the modifications made
# in this repository (MASQUE by default, GOST v3, Debian base, etc.), so the
# image is built locally from the Dockerfile:
#
#   docker compose up -d --build
#
# To use a different GOST version, change GOST_VERSION below.

services:
  warp:
    build:
      context: .
      args:
        GOST_VERSION: 3.2.6
    image: warp-docker:latest
    container_name: warp
    restart: always
    # add removed rule back (https://github.com/opencontainers/runc/pull/3468)
    device_cgroup_rules:
      - 'c 10:200 rwm'
    ports:
      - "1080:1080"
    environment:
      - WARP_SLEEP=2
      # - WARP_LICENSE_KEY= # optional
      # - WARP_ENABLE_NAT=1 # enable nat
      # - WARP_IP_ROTATE_INTERVAL=6h # rotate the WARP IP periodically (GNU sleep duration, e.g. 3600, 30m, 6h)
      #
      # WARP_PROXY (chaining the tunnel through an upstream SOCKS5 proxy) is
      # NOT supported by the official WARP client. Use the sing-box or xray
      # multi-IP mode (docker-compose.singbox.yml / docker-compose.xray.yml)
      # instead.
    cap_add:
      # Docker already have them, these are for podman users
      - MKNOD
      - AUDIT_WRITE
      # additional required cap for warp, both for podman and docker
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
      # uncomment for nat
      # - net.ipv4.ip_forward=1
      # - net.ipv6.conf.all.forwarding=1
      # - net.ipv6.conf.all.accept_ra=2
    volumes:
      - ./data:/var/lib/cloudflare-warp